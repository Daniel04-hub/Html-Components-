<html>
    <title>
        page on form element
    </title>


    <style>

        body{
            margin: 0;
        }
     .page {
        
        overflow: hidden;
        background-color: bisque;
        padding: 16px 12px;

     }

    .page a:hover{
        background-color: azure;
        color: black;
    }


     .page a{
        background-color: aqua;
        padding: 16px 12px;
        text-decoration: none;
     }
    </style>
    <body>


        <div class="page">
            <a class="king" href="#">king</a>
            <a class="king2" href="#">wrong</a>
            <a class="king3" href="#">rum</a>

        </div>
        <label for="cars">choose a car</label>
        <select name="cars" id="cars">
            <option value="porchee911">porche911</option>
            <option value="volovo">volovo</option>
            <option value="BMW">BMW</option>
            <option value="celerio">celerio</option>
        </select>




        <p>to give an option on the tabs we can use select 
            and the element option
        </p>
    </body>
</html>
