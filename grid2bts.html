<html>
    <head>
          <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <title>
            bootstrap heading example

        </title>
    </head>
    <body>
        <div class="container-fluid">
        <div class="row">
            <div class="col-3 bg-primary text-warning p-3">1 of 2</div>
            <div class="col-3 bg-danger text-warning">2 of 2</div>

        </div>

        <div class="row">
            <div class=" col-md-6 bg-primary text-warning">1/7</div>
            <div class="col-md-10 bg-warning text-light">2/7</div>
            <div class="col-md-6 bg-primary text-warning">3/7</div>
            <div class="col-md-10 bg-warning text-light">4/7</div>

        </div>
        </body>
        </html>
