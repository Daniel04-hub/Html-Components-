<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class=" container mt-3 p-5">
  <div class="btn-group ">
    <button type="button" class="btn btn-warning">Apple</button>
    <button type="button" class="btn btn-success">Samsung</button>
    <button type="button" class="btn btn-danger">daniel</button>
  </div>
  

  <div class="btn-group btn-group-lg">

    <button type="button" class="btn btn-warning">apple</button>

  </div>

  <div class=" btn-group-vertical ">
    <button type="button" class="btn btn-warning">thankyou</button>
    <button type="button" class="btn btn-info">happy</button>
  </div>


  <div class="btn-group">
    <button type="button" class="btn">hello</button>
    <div class="btn btn-group">
        <button type="button" class="btn btn-primary dropdown" data-bs-toggle="dropdown">sony</button>

        <div class="dropdown-menu ">
            <a class="dropdown-item" href="#">Tablet</a>
            <a href="#" class="dropdown-item">phone</a>
        </div>

    </div>
     <div class="btn btn-group">
        <button type="button" class="btn btn-warning  dropdown-toggle" data-bs-toggle="dropdown">sony</button> 
    <div class="dropdown-menu">
        <a href="#" class="dropdown-item">hello</a>
        <a href="" class="dropdown-item">warning</a>
        <a href="" class="dropdown-item">danger</a>
        <a href="" class="dropdown-item">wrong</a>
     </div>
    </div>
  </div>
  </div>
    </body>
    </html>
