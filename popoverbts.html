<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-3">
  <h3>Popover Example</h3>
   <a href="#" title="header" data-bs-toggle="popover">top</a>
  <button type="button" class="btn btn-primary" data-bs-placement="bottom" data-bs-toggle="popover" title="Popover Header" data-bs-content="Some content inside the popover">
    Toggle popover
  </button>
</div>
<br>\<br>

<div class="container mt-3">
    <a href="#" title="dismissible popover" data-bs-toggle="popover" data-bs-trigger="focus" data-bs-content="any where">hi</a>

</div>

<div class="container mt-3">
    <a href="#" title="header" data-bs-toggle="popover" data-bs-trigger="hover" data-bs-content="popover text">hey</a>

</div>


<div class="toast show">
    <div class="toast-header">
        toast-header
        <button type="button" class="btn-close" data-bs-dismiss="toast">

        </button>
    </div>
    <div class="toast-body">some thing</div>

</div>



<script>
var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'))
var popoverList = popoverTriggerList.map(function (popoverTriggerEl) {
  return new bootstrap.Popover(popoverTriggerEl)
})
</script>

</body>
</html>
