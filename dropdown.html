<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-3">
        <div class="dropdown">
            <button type="button" class="btn btn-primary dropdown-toggle"
            data-bs-toggle="dropdown">click me</button>

            <ul class="dropdown-menu">
                <li  class="dropdown-item">hi</li>
                <li class="dropdown-item">hello</li>
            </ul>

        </div>

        <br>
        <div class="btn-group">
            <button type="button" class="btn btn-success">
                click me
            </button>
            <div class="btn-group">
                <button class="btn btn-warning dropdown-toggle " data-bs-toggle="dropdown">hello</button>
                <ul class="dropdown-menu" >
                    <li class="dropdown-item">den</li>
                    <li class="dropdown-item">dan</li>

                </ul>

            </div>
            <button type="button" class="btn btn-light">hi click</button>
            

        </div>
    </div>
    </body>
    </html>
