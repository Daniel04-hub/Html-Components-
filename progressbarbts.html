<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div class="container mt-3 p-5"></div>
    <div class="progress" style="height: 20px;">
        <div class="progress-bar bg-info text-warning progress-bar-striped progress-bar-animated" style="width:70%;">70</div>

    </div>
     <div class="container mt-3 p-5">
    <div class="progress">
        <div class="progress-bar bg-warning progress-bar-striped progress-bar-animated" style="width: 70%;">70%</div>
        <div class="progress-bar bg-info progress-bar-striped progress-bar-animated" style="width: 20%;">20%</div>
        <div class="progress-bar bg-danger progress-bar-striped progress-bar-animated" style="width: 100%;">100%</div>
    </div>
    <br>

    <div class="spinner-border">
<br>
<br>
         <div class="spinner-border text-muted"></div>

    </div>
    </div>
</body>
</html>
