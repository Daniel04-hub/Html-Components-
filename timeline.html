<!DOCTYPE html>
<html>
<head>
  <style>
    .timeline {
      position: relative;
      margin: 0 auto;
      width: 4px;
      background-color: #333;
      height: 100vh; /* full height of the viewport */
    }

    .event {
      position: relative;
      top: px;
      left: 20px;
      margin: 20px 0;
    }

    .dot {
      position: absolute;
      left: -10px;
      top: 0;
      width: 20px;
      height: 20px;
      background-color: #fff;
      border: 3px solid #333;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="timeline">

  <div class="event">
    <h1>kuiuhoiijoij</h1>
    <div class="dot">
        
    </div>
    <p>Event One</p>
  </div>

  <div class="event">
    <div class="dot"></div>
    <p>Event Two</p>
  </div>
  </div>
</body>
</html>
