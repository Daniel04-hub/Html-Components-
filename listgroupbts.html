<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div class="container mt-3">
        <h2>Basic List Group</h2>
        <ul class="list-group">
            <li class="list-group-item active">first </li>
            <li class="list-group-item">second</li>
            <li class="list-group-item">third</li>

        </ul>

    </div>

<div class="container mt-5" class="list-group">
    <a href="#" class="list-group-item list-group-item-action">first items</a>

    <a href="#" class="list-group-item list-group-item-action">second item</a>


<a href="#" class="list-group-item list-group-item-action disabled">third item</a>
    
</div>
<br>
<div class="container mt-5">
    <ol class="list-group list-group-flush list-group-horizontal">

        <a href="#" class="list-group-item  list-group-item-action">first 
            <span class="badge bg-primary rounded-pill">50+</span>
        </a>
        <a href="#"  class="list-group-item list-group-item-primary  list-group-item-action">second</a>
        <li class="list-group-item">third</li>
    </ol>
</div>
</body>
    </html>
